name: 🐞 Bug report
description: Something is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Do not include customer names, phone numbers, PINs or database files.**
        For security problems, use the *Security* tab instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Log in as Technician
        2. Open order ORD-1001
        3. Click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Role
      multiple: true
      options: [Manager, Front Desk, Technician, Not role-specific]
  - type: input
    id: version
    attributes:
      label: ERP version
      placeholder: "3.0.0"
  - type: input
    id: node
    attributes:
      label: Node.js version (`node --version`)
      placeholder: v22.13.0
  - type: input
    id: env
    attributes:
      label: Server OS and browser
      placeholder: Windows 11, Chrome 130
  - type: textarea
    id: logs
    attributes:
      label: Server console output
      render: text
