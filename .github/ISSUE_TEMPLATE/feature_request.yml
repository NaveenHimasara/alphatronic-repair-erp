name: ✨ Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation in the shop where this would help.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Which role benefits?
      multiple: true
      options: [Manager, Front Desk, Technician, All]
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
